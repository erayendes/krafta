# Actions are pinned to commit SHAs (supply-chain hardening), which freezes them until
# something bumps them deliberately — that something is this file.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  # playwright and axe-core are pinned to exact versions on purpose: a browser or rule
  # update can change measurements, so each bump is reviewed on its own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
