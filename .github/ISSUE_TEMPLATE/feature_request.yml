name: Feature request
description: Suggest an improvement or a new capability.
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - A new gate rule (krafta check)
        - The audit report (krafta audit)
        - The source scan (krafta scan)
        - Config
        - Agent skill
        - Playwright / API
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the need before proposing a solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, screenshots, or relevant links.
