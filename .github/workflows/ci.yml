# Every action is pinned to a full commit SHA with its release tag in a trailing comment.
# A moving tag (@v4) can be repointed at other code; a SHA cannot. Dependabot reads the
# comment and bumps both together (see .github/dependabot.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded runs on the same ref are pointless; cancel them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:playwright
      # The package must contain the CLI, the types, the skill and the schema.
      - name: Package contents
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const files = JSON.parse(require('fs').readFileSync('pack.json', 'utf8'))[0].files.map(f => f.path);
            const required = ['dist/bin/krafta.js', 'dist/src/index.d.ts', 'dist/src/check/defaults.json', 'skills/krafta/SKILL.md', 'schema/krafta.config.schema.json', 'NOTICE'];
            const missing = required.filter(f => !files.includes(f));
            if (missing.length) { console.error('Missing from package: ' + missing.join(', ')); process.exit(1); }
          "

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: test-results-node-${{ matrix.node }}
          path: test-results/
          retention-days: 14

  check:
    # This name is the required status check a branch ruleset asks for. It passes only
    # when every test job passed, so the ruleset needs one name for the whole matrix.
    # Rename it and you must update the ruleset too (scripts/harden-public-repo.sh).
    name: Check
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All test jobs passed
        run: test "${{ needs.test.result }}" = "success"
